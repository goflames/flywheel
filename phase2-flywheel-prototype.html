<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="I8vBgoYsr9hgxpaV70T155">
<head data-page-node-id="9OFMJmuaOJimdGwSqDBBMP">
<!-- Phase 2 飞轮二期原型定稿   基于「Phase2-小模型生产路由指标-原型.html」迭代；历史迭代：①侧边栏分组「问题管理」改名为「质量管理」；②曾将「小模型评分质量监控」+「小模型准确率指标」从飞轮监控页抽离为独立的「模型看板」Tab后续迭代已移除「模型看板」页，两张卡片随之移除。 -->
<meta charset="UTF-8" data-page-node-id="fzbQI3DfmqQE9t9dwHy5OC">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="fm1yhSgTuMc9KLsK5YyYaH">
<title>质量指标监测与配置管理</title>
<style>
:root{
  --sidebar-w:300px; --header-h:52px;
  --c-bg:#F6F7F9; --c-surface:#FFFFFF; --c-surface-hover:#F3F5F7;
  --c-border:rgba(0,0,0,.08); --c-border-strong:rgba(0,0,0,.14);
  --c-text:#1A1C1F; --c-text-2:#5C6068; --c-text-3:#9AA0AA;
  --c-primary:#185FA5; --c-primary-bg:#E8F0FA;
  --c-success:#3B6D11; --c-success-bg:#EDF5E6;
  --c-warning:#BA7517; --c-warning-bg:#FBF2E1;
  --c-danger:#E24B4A; --c-danger-bg:#FCEAEA;
  --c-p0:#E24B4A;--c-p0-bg:#FDE8E8; --c-p1:#BA7517;--c-p1-bg:#FBF2E1; --c-p2:#6B7280;--c-p2-bg:#EEF0F2;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow:0 8px 28px rgba(20,28,40,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;font-size:13px;color:var(--c-text);background:var(--c-bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}

/* ── header ── */
.header{height:var(--header-h);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;z-index:50}
.logo{font-weight:700;font-size:15px;letter-spacing:-.02em}
.logo b{color:var(--c-primary)}
.crumb{font-size:12px;color:var(--c-text-3);flex:1}
.crumb b{color:var(--c-text-2);font-weight:500}
.search{width:200px;height:32px;padding:0 12px;border:1px solid var(--c-border);border-radius:var(--radius-sm);font-size:12px;background:var(--c-bg);outline:none}
.search:focus{border-color:var(--c-primary)}
.btn{height:30px;padding:0 12px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-surface);font-size:12px;color:var(--c-text-2);display:inline-flex;align-items:center;gap:5px;transition:.15s}
.btn:hover{border-color:var(--c-border-strong);color:var(--c-text)}
.btn.primary{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.btn.primary:hover{opacity:.92}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
.btn.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn.warn{background:var(--c-warning-bg);border-color:var(--c-warning);color:var(--c-warning)}
.btn.warn:hover{border-color:var(--c-warning);color:var(--c-warning)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}

/* ── layout ── */
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--c-surface);border-right:1px solid var(--c-border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}

/* ── 项目切换器置于侧边栏顶部，最左常驻 ── */
.proj{position:relative;display:flex;align-items:center;gap:8px;margin:10px 10px 4px;padding:9px 10px;border:1px solid var(--c-border);border-radius:var(--radius-md);background:var(--c-bg);cursor:pointer;transition:.12s;flex-shrink:0}
.proj:hover{border-color:var(--c-border-strong)}
.proj.open{border-color:var(--c-primary);box-shadow:0 0 0 2px var(--c-primary-bg)}
.proj-info{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.proj-avatar{width:28px;height:28px;border-radius:8px;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.proj-meta{min-width:0;flex:1}
.proj-name{font-size:14.5px;font-weight:600;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-sub{font-size:12px;color:var(--c-text-3);margin-top:1px}
.proj-caret{color:var(--c-text-3);font-size:11px;flex-shrink:0;transition:.15s}
.proj.open .proj-caret{transform:rotate(180deg)}
.proj-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--c-surface);border:1px solid var(--c-border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:5px;z-index:100}
.proj.open .proj-menu{display:block}
.proj-item{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:var(--radius-sm);font-size:13px;color:var(--c-text-2);cursor:pointer}
.proj-item:hover{background:var(--c-surface-hover);color:var(--c-text)}
.proj-item.active{color:var(--c-primary);font-weight:600}
.proj-item:not(.active) .proj-check{display:none}
.proj-check{margin-left:auto;font-size:12px}
.proj-sep{height:1px;background:var(--c-border);margin:5px 4px}
.proj-new{color:var(--c-primary)}
.group-title{padding:16px 18px 6px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--c-text-3);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 18px;margin:1px 8px;border-radius:var(--radius-sm);font-size:14.5px;color:var(--c-text-2);cursor:pointer;transition:.12s;position:relative}
.nav-item:hover{background:var(--c-surface-hover);color:var(--c-text)}
.nav-item.active{background:var(--c-primary-bg);color:var(--c-primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--c-primary)}
.badge{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--c-border);color:var(--c-text-3);font-weight:600}
.badge.p0{background:var(--c-p0-bg);color:var(--c-p0)}
.badge.warn{background:var(--c-warning-bg);color:var(--c-warning)}

/* ── 内嵌树测试集页专用── */
/* 评测集浏览：顶部分面导航替代左侧树 */
.scope-bar{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:14px}
.scope-groups{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scope-group{padding:6px 14px;border:1px solid var(--c-border);border-radius:20px;font-size:13px;color:var(--c-text-2);cursor:pointer;background:#fff;transition:.15s;white-space:nowrap}
.scope-group:hover{border-color:var(--c-primary);color:var(--c-primary)}
.scope-group.active{background:var(--c-primary);border-color:var(--c-primary);color:#fff;font-weight:500}
.scope-subs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--c-border)}
.scope-sub{padding:4px 12px;border-radius:16px;font-size:12px;color:var(--c-text-2);background:var(--c-surface-hover);cursor:pointer;transition:.15s;white-space:nowrap}
.scope-sub:hover{color:var(--c-primary)}
.scope-sub.active{background:var(--c-primary-bg);color:var(--c-primary);font-weight:500}
.scope-sub .cnt{margin-left:5px;font-size:11px;opacity:.7}
.ds-crumb{font-size:12px;color:var(--c-text-3);margin-bottom:10px}
.ds-crumb b{color:var(--c-text);font-weight:500}

/* ── 评测集分面下钻替代左侧深树── */
.ds-facets{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:14px}
.facet-row{display:flex;align-items:flex-start;gap:10px}
.facet-row + .facet-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--c-border)}
.facet-label{flex:0 0 64px;font-size:12px;color:var(--c-text-3);padding-top:5px;font-weight:500}
.facet-label .req{color:var(--c-danger)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:4px 12px;border-radius:16px;font-size:12px;color:var(--c-text-2);background:var(--c-surface-hover);cursor:pointer;transition:.15s;white-space:nowrap;border:1px solid transparent}
.chip:hover{color:var(--c-primary);border-color:var(--c-primary)}
.chip.active{background:var(--c-primary);color:#fff;font-weight:500}
.chip.muted{opacity:.45}
.ds-facet-note{font-size:11px;color:var(--c-text-3);margin-top:8px;display:flex;align-items:center;gap:6px}
.ds-facet-note .lv{color:var(--c-danger);font-weight:600}

/* 等级徽章 */
.lv-badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;line-height:1.6}
.lv-badge.lv-p0{background:var(--c-danger-bg);color:var(--c-danger)}
.lv-badge.lv-p1{background:#fff4e0;color:#C77700}
.lv-badge.lv-p2{background:#eef2ff;color:#4257d6}
.lv-badge.lv-n{background:var(--c-surface-hover);color:var(--c-text-3)}

.main{flex:1;overflow-y:auto;padding:22px 26px 60px}

/* ── page ── */
.page{display:none;animation:fade .18s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:18px}
.page-sub{font-size:12.5px;color:var(--c-text-3);margin-top:4px}
.page-title{font-size:19px;font-weight:700;margin-bottom:3px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* metrics cards */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.mcard{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:16px 18px}
.mlabel{font-size:12px;color:var(--c-text-2);display:flex;justify-content:space-between;align-items:center}
.mval{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.msub{font-size:12px;margin-top:3px;color:var(--c-text-3)}
.msub.up{color:var(--c-success)} .msub.down{color:var(--c-danger)}

/* ── 飞轮监控：核心 KPI 横幅 + 板块分节 ── */
.kpi-banner{display:flex;align-items:center;gap:18px;background:linear-gradient(100deg,var(--c-primary-bg),#fff);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:18px}
.kpi-main{flex:0 0 auto;padding-right:18px;border-right:1px solid var(--c-border)}
.kpi-label{font-size:12px;color:var(--c-text-2);font-weight:600;letter-spacing:.02em}
.kpi-val{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--c-primary);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi-val .u{font-size:16px;font-weight:600;margin-left:2px;color:var(--c-text-2)}
.kpi-sub{font-size:12px;color:var(--c-text-3);margin-top:6px}
.kpi-split{display:flex;gap:26px;flex:1}
.kpi-sp{display:flex;flex-direction:column;gap:2px}
.kpi-sp span{font-size:11px;color:var(--c-text-3)}
.kpi-sp b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.persp{display:flex;align-items:center;gap:10px;margin:26px 0 14px;padding:11px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-left:3px solid var(--c-primary);border-radius:var(--radius-md)}
.persp .no{font-size:11px;font-weight:700;color:#fff;background:var(--c-primary);padding:2px 9px;border-radius:8px;white-space:nowrap}
.persp .tt{font-size:15px;font-weight:700;color:var(--c-text)}
.persp .en{font-size:12px;color:var(--c-text-3);font-weight:500}
.mcard.todo{border-style:dashed;background:var(--c-surface-hover)}
.mcard.todo .mval{color:var(--c-text-2)}

/* grid & card */
.grid{display:flex;gap:16px}.grid-2{grid-template-columns:1fr 1fr;display:grid;gap:16px}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);overflow:hidden}
.card-h{padding:13px 18px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between}
.card-h .t{font-size:14px;font-weight:600}
.card-b{padding:14px 18px}

/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:9px 10px;color:var(--c-text-3);font-weight:500;font-size:11.5px;border-bottom:1px solid var(--c-border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--c-border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:var(--c-surface-hover)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--c-text-2)}
.utt{display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.utt:hover{white-space:normal;overflow:visible}
.resp{display:inline-block;max-width:300px;color:var(--c-text-2);font-size:12px;line-height:1.4;vertical-align:top}

/* pills */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:6px 13px;border:1px solid var(--c-border);border-radius:20px;font-size:12.5px;color:var(--c-text-2);background:var(--c-surface);cursor:pointer;transition:.12s;display:flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--c-border-strong)}
.pill.active{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.pill .cnt{font-size:11px;background:rgba(0,0,0,.07);padding:0 6px;border-radius:8px}
.pill.active .cnt{background:rgba(255,255,255,.25)}

/* tags */
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:600;line-height:18px}
.tag.p0{background:var(--c-p0-bg);color:var(--c-p0)}.tag.p1{background:var(--c-p1-bg);color:var(--c-p1)}.tag.p2{background:var(--c-p2-bg);color:var(--c-p2)}
.tag.ok{background:var(--c-success-bg);color:var(--c-success)}.tag.warn{background:var(--c-warning-bg);color:var(--c-warning)}.tag.err{background:var(--c-danger-bg);color:var(--c-danger)}.tag.gray{background:var(--c-p2-bg);color:var(--c-p2)}.tag.primary{background:var(--c-primary-bg);color:var(--c-primary)}
.score{display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:5px;font-size:12px;font-weight:700}
.score.s-low{background:var(--c-danger-bg);color:var(--c-danger)}.score.s-mid{background:var(--c-warning-bg);color:var(--c-warning)}.score.s-high{background:var(--c-success-bg);color:var(--c-success)}

/* 仪表盘两栏 + 进度条 + 环形图 */
.dash-row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:16px;margin-bottom:16px}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--c-border)}
.mini-stat{text-align:center}
.mini-stat .v{font-size:16px;font-weight:700}
.mini-stat .l{font-size:11px;color:var(--c-text-3);margin-top:2px}
.bar{height:8px;background:var(--c-surface-hover);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--c-primary);border-radius:6px;transition:width .3s}

/* ── 表头排序指示 ── */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--c-primary)}
.sort{display:inline-flex;align-items:center;gap:2px;margin-left:4px;color:var(--c-text-3);font-size:10px}
th.sortable.asc .sort::after{content:'▲'}
th.sortable.desc .sort::after{content:'▼'}
th.sortable .sort::after{content:'⇅'}

/* ── 质量监测：Agent 质量指标卡片 ── */
.qm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 18px;margin:6px 0 4px}
.qm-cell{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:16px 18px}
.qm-h{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.qm-name-info{display:flex;align-items:center;gap:5px}
.qm-name{font-size:13px;font-weight:600;color:var(--c-text)}
.qm-sub{font-size:11px;color:var(--c-text-3)}
.qm-val{font-size:20px;font-weight:700;color:var(--c-text);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.qm-target{font-size:11px;font-weight:600}
@media(max-width:680px){.qm-grid{grid-template-columns:1fr}.cost-sys-row{grid-template-columns:1fr}}
/* ── 质量监测：评测 Token 成本 ── */
.cost-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.cm{text-align:center;padding:12px 8px;border-radius:var(--radius-sm);background:var(--c-surface-hover)}
.cm .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--c-text)}
.cm .l{font-size:11px;color:var(--c-text-3);margin-top:2px}
.cost-split{display:flex;align-items:center;gap:32px;margin:6px 0 18px;flex-wrap:wrap}
.donut-wrap{flex:none}
.legend{flex:1;min-width:220px}
.lg{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.lg .dot{width:10px;height:10px;border-radius:50%;flex:none}
.lg-name{flex:1;color:var(--c-text-2)}
.lg-val{font-variant-numeric:tabular-nums;color:var(--c-text-3);font-size:12px}
.lg-note{font-size:11px;color:var(--c-text-3);margin-top:8px;padding-top:8px;border-top:1px dashed var(--c-border)}
/* 生产全量意图路由分布：横向条形图替代饼图，占满宽度、无中心空洞、无彩带 */
.rmx{display:flex;flex-direction:column;gap:13px}
.rmx-list{display:flex;flex-direction:column;gap:13px}
.rmx-row{display:flex;align-items:center;gap:12px}
.rmx-name{width:112px;flex:none;font-size:13px;color:var(--c-text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmx-track{flex:1;height:10px;border-radius:5px;background:var(--c-border);overflow:hidden}
.rmx-fill{height:100%;border-radius:5px}
.rmx-pct{width:56px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--c-text);font-size:13px}
.rmx-cnt{width:62px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--c-text-3);font-size:12px}
.rmx-sub{display:flex;flex-direction:column;gap:6px;margin:-8px 0 4px 124px;padding-left:14px;border-left:2px solid var(--c-border)}
.rmx-sub-row{display:flex;align-items:center;gap:10px}
.rmx-sub-name{width:64px;flex:none;font-size:12px;color:var(--c-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmx-sub-track{flex:1;min-width:60px;height:7px;border-radius:4px;background:var(--c-border);overflow:hidden}
.rmx-sub-fill{height:100%;border-radius:4px}
.rmx-sub-pct{width:50px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--c-text-2);font-size:12px}
.rmx-sub-cnt{width:52px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--c-text-3);font-size:11px}
.rmx-date{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.rmx-date .lbl{font-size:12.5px;color:var(--c-text-3)}
.rmx-date select{font-size:12.5px;padding:4px 8px;border:1px solid var(--c-border);border-radius:6px;background:var(--c-bg);color:var(--c-text);cursor:pointer}
.trend-title{font-size:13px;font-weight:600;color:var(--c-text);margin-bottom:12px}
.cost-trend{margin-top:6px}
.cost-sys-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
.cost-sys{border:1px solid var(--c-border);border-radius:10px;padding:16px 18px;background:var(--c-card,#fff)}
.cs-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--c-text);margin-bottom:14px}
.cs-h .dot{width:9px;height:9px;border-radius:50%;flex:none}
.cost-range{display:flex;gap:6px;margin-left:auto}
.cost-range .range-tab{font-size:12px;padding:4px 12px;border-radius:6px;cursor:pointer;color:var(--c-text-2);border:1px solid var(--c-border);background:#fff;user-select:none}
.cost-range .range-tab.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
/* ── 质量监测：兜底话术触发率8 类独立打标   顶部总值 + 趋势，下钻 7/30 日── */
.fb-overall{display:grid;grid-template-columns:180px minmax(240px,360px);gap:40px;justify-content:center;align-items:center;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--c-border)}
/* 折线图主卡片意图识别准确率 / 上下文承接成功率 / 兜底话术触发率撑满卡片宽，折线图随宽度放大 */
.fb-overall-main{grid-template-columns:auto minmax(0,1fr);gap:24px;justify-content:flex-start;border-bottom:none;padding-bottom:0;margin-bottom:14px}
.fb-overall-main .fb-overall-right{padding-left:8px}
.fb-overall-left{display:flex;flex-direction:column;gap:4px;min-width:0}
.fb-total{font-size:30px;font-weight:700;color:var(--c-primary);line-height:1;font-variant-numeric:tabular-nums}
.fb-total.warn{color:var(--c-danger)}
.fb-total-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--c-text-3)}
.fb-delta{font-weight:700;display:inline-flex;align-items:center;gap:2px}
.fb-delta.up{color:var(--c-danger)}.fb-delta.down{color:var(--c-success)}.fb-delta.flat{color:var(--c-text-3)}
.fb-overall-right{display:flex;flex-direction:column;gap:2px;min-width:0}
.fb-overall-right .trend-title{margin-bottom:4px}
.fb-overall-right{cursor:pointer}
.fb-zoom{margin-left:8px;font-size:11px;color:var(--c-primary);font-weight:600;cursor:pointer;white-space:nowrap}
.fb-zoom:hover{text-decoration:underline}
.fb-spark{cursor:pointer}
.fb-modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:999;padding:24px}
.fb-modal{background:#fff;border-radius:14px;width:min(780px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.30)}
.fb-modal-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--c-border);position:sticky;top:0;background:#fff;z-index:2}
.fb-modal-h .t{font-size:16px;font-weight:700;color:var(--c-text)}
.fb-modal-x{margin-left:auto;font-size:22px;line-height:1;color:var(--c-text-3);cursor:pointer;padding:0 4px}
.fb-modal-x:hover{color:var(--c-danger)}
.fb-modal-body{padding:18px 20px}
.fb-big-chart{margin-bottom:18px;padding:10px;background:#FAFBFC;border-radius:10px;border:1px solid var(--c-border)}

.fb-list{display:flex;flex-direction:column;gap:8px}
.fb-row{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,1.4fr) 64px 130px;align-items:center;gap:14px;padding:8px 0;border-bottom:1px dashed var(--c-border)}
.fb-row:last-child{border-bottom:0}
.fb-name{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--c-text);min-width:0}
.fb-name .fb-name-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.fb-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--c-text-3);letter-spacing:.2px;white-space:nowrap;flex:0 0 auto}
.fb-bar-wrap{height:10px;background:#EEF1F4;border-radius:6px;overflow:hidden}
.fb-bar{height:100%;border-radius:6px;transition:width .3s}
.fb-val-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:0}
.fb-val-delta{font-size:10.5px;font-weight:600;line-height:1.2;display:inline-flex;align-items:center;gap:1px}
.fb-val-delta.up{color:var(--c-danger)}.fb-val-delta.down{color:var(--c-success)}.fb-val-delta.flat{color:var(--c-text-3)}
.fb-val-num{font-size:13px;font-weight:600;color:var(--c-text);line-height:1.2;font-variant-numeric:tabular-nums}
.fb-spark{width:130px;height:30px;display:flex;align-items:center;justify-content:flex-end}
.fb-spark svg{display:block;width:100%;height:100%}
@media(max-width:680px){.fb-row{grid-template-columns:120px 1fr 56px 90px;gap:10px}.fb-spark{width:90px}.fb-val-delta{font-size:9.5px}}

/* ── 意图识别准确率：按 7 主意图路由识别错误分布环形饼图── */
.im-sub-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.im-sub-h .t{font-size:13.5px;font-weight:600;color:var(--c-text)}
.im-hint{font-size:11.5px;color:var(--c-text-3);margin-left:4px;letter-spacing:.1px}
/* 子分类折叠意图识别 / 上下文承接 / 兜底话术触发 的明细分布 */
.collapsible{cursor:pointer;user-select:none}
.collapsible:hover .t{color:var(--c-accent,#1A66C0)}
.collapsible .chev{margin-left:auto;font-size:13px;line-height:1;color:var(--c-text-3);transition:transform .2s ease;flex:none}
.collapse-body.collapsed{display:none}
/* 主意图路由识别错误分布：饼图 + 两列图例 */
.im-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 20px;align-content:center;margin-top:2px}
.im-legend .lg{display:flex;align-items:center;gap:9px;padding:6px 8px;margin:0 -8px;border-radius:7px;cursor:pointer;transition:background .15s,box-shadow .15s}
.im-legend .lg:hover{background:var(--c-surface-hover,#F3F6F9);box-shadow:inset 0 0 0 1px var(--c-border)}
.im-legend .lg .dot{width:9px;height:9px;border-radius:50%;flex:none}
.im-legend .lg-name{flex:1;color:var(--c-text-2);font-weight:500}
.im-d-sub{font-size:13px;font-weight:600;color:var(--c-text);margin:14px 0 10px}
/* ── 质量监测：意图识别错误 / 上下文承接低分 分类展开 · 每组两根柱（采样/错误），错误柱按严重度着色，替代占比饼图 ── */
.imcc{display:flex;align-items:flex-end;gap:8px;margin:6px 0 2px;padding:4px 2px 0;overflow-x:auto}
.imcc-grp{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex:1 0 auto;min-width:50px;padding:0 2px}
.imcc-grp:hover{opacity:.82}
.imcc-rate{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;line-height:1.1}
.imcc-rate.rate-high{color:#D4380D}
.imcc-rate.rate-mid{color:#E08A00}
.imcc-rate.rate-low{color:#3FA66A}
.imcc-bars{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:150px}
.imcc-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.imcc-cnt{font-size:10px;color:var(--c-text-3);font-variant-numeric:tabular-nums;line-height:1}
.imcc-cnt.err{font-weight:700}
.imcc-cnt.err.rate-high{color:#D4380D}
.imcc-cnt.err.rate-mid{color:#E08A00}
.imcc-cnt.err.rate-low{color:#3FA66A}
.imcc-bar{width:20px;border-radius:4px 4px 0 0;min-height:2px}
.imcc-samp{background:#C2CEDC}
.imcc-err.rate-high{background:#D4380D}
.imcc-err.rate-mid{background:#E08A00}
.imcc-err.rate-low{background:#3FA66A}
.imcc-name{font-size:11px;color:var(--c-text);font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px;margin-top:2px}
.imcc-legend{display:flex;align-items:center;gap:18px;margin:12px 2px 0;font-size:11.5px;color:var(--c-text-3)}
.imcc-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.imcc-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--c-border);font-size:11.5px;color:var(--c-text-3);line-height:1.45}
.imcc-foot b{color:var(--c-text);font-weight:700;font-variant-numeric:tabular-nums}
.im-list{display:flex;flex-direction:column;gap:10px}
.im-item{border:1px solid var(--c-border);border-radius:8px;padding:10px 12px;background:#fff}
.im-item-utter{font-size:13px;font-weight:600;color:var(--c-text);margin-bottom:7px}
.im-item-flow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.im-arrow{color:var(--c-text-3);font-size:13px;font-weight:600}
.im-item-note{font-size:12px;color:var(--c-text-2);line-height:1.5}
.im-foot{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.im-page-btn{font-size:12.5px;color:var(--c-primary);background:#fff;border:1px solid var(--c-border);border-radius:6px;padding:5px 14px;cursor:pointer}
.im-page-btn:hover:not([disabled]){background:var(--c-surface-hover,#F3F6F9)}
.im-page-btn[disabled]{color:var(--c-text-3);cursor:not-allowed;opacity:.6}
.im-page-ind{font-size:12.5px;color:var(--c-text-2)}
.im-detail{width:100%;border-collapse:collapse;font-size:12.5px}
.im-detail th{text-align:left;padding:8px 10px;color:var(--c-text-3);font-weight:600;border-bottom:1px solid var(--c-border);font-size:11.5px;white-space:nowrap}
.im-detail td{padding:9px 10px;border-bottom:1px dashed var(--c-border);color:var(--c-text);vertical-align:top}
.im-detail tr:last-child td{border-bottom:0}
.im-utter{color:var(--c-text);max-width:210px}
.im-note{color:var(--c-text-3);font-size:12px;max-width:240px}
.im-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.im-tag.routed{background:#FDECEA;color:#D4380D}
.im-tag.correct{background:#E7F4EC;color:#1A8F4E}
/* 意图识别准确率：独立成区饼图 + 整体大图弹窗 */
.donut-seg{cursor:pointer}
.im-legend-row{cursor:pointer;border-radius:6px;padding:5px 6px;margin:0 -6px}
.im-legend-row:hover{background:var(--c-surface-hover)}

/* ── 抽屉顶栏元数据 ── */
.dmeta{padding:10px 18px;border-bottom:1px solid var(--c-border);display:flex;flex-wrap:wrap;gap:14px 22px;background:var(--c-surface-hover)}
.dmeta-item{display:flex;flex-direction:column;gap:3px;min-width:84px}
.dmeta-item .k{font-size:10.5px;color:var(--c-text-3)}
.dmeta-item .v{font-size:12.5px;font-weight:500;color:var(--c-text);display:flex;align-items:center;gap:4px}
.dmeta-item .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.dmeta-item .v .star{color:var(--c-warning)}

/* ── 抽屉底部分页器 ── */
.dfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--c-border)}
.pager{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c-text-2)}
.pager button{height:24px;min-width:24px;padding:0 7px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-surface);font-size:11.5px;color:var(--c-text-2)}
.pager button:hover:not(:disabled){border-color:var(--c-primary);color:var(--c-primary)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .pg-info{font-variant-numeric:tabular-nums}
.foot-actions{display:flex;flex-direction:column;gap:10px;align-items:stretch;flex-wrap:wrap}
.foot-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.obj-banner{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border-left:3px solid var(--c-primary);border-radius:6px;background:var(--c-primary-bg);font-size:12.5px;color:var(--c-text-2)}
.obj-banner .obj-txt b{color:var(--c-text-1)}
.obj-banner .obj-note{color:var(--c-text-3);margin-left:4px}
.fld-note{font-size:12px;color:var(--c-text-3);margin:2px 0 10px;line-height:1.5}
.fld-note.obj{margin-top:-4px}
.fld-note.obj .obj-tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:5px;background:var(--c-surface-hover);color:var(--c-text-3);font-size:11px}
.fld-note.sim{margin:6px 0 10px;padding:8px 10px;border-radius:7px;background:color-mix(in srgb,var(--c-warn-bg) 55%,var(--c-surface));border:1px solid color-mix(in srgb,var(--c-warn) 40%,transparent);color:var(--c-text-2)}
.fld-note.sim b{color:var(--c-warn);font-family:ui-monospace,Menlo,monospace}

/* ── 抽屉结构化数据：推荐标签云 + 菜品详情 ── */
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag-cloud .ct{font-size:11px;padding:2px 9px;border-radius:12px;background:var(--c-surface);color:var(--c-text-2);border:1px solid var(--c-border)}
.dish-detail{margin-top:10px;padding:12px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-surface-hover)}
.dish-detail .dd-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dish-detail .dd-name{font-weight:600;font-size:13px}
.dish-detail .dd-row{display:flex;gap:14px;font-size:12px;color:var(--c-text-2);flex-wrap:wrap}
.dish-detail .dd-row b{color:var(--c-text);font-weight:600}

/* ── 人工复核追踪字段 ── */
.track-field{margin-bottom:12px}
.track-field .tf-label{font-size:12px;font-weight:600;margin-bottom:5px;color:var(--c-text-2)}
.track-field textarea{width:100%;height:60px;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:8px;font-family:inherit;font-size:12.5px;resize:none;background:#fff;box-sizing:border-box}

/* ── Bad Case 桶视图 ── */
.buck-summary{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.buck-stat{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:12px 16px;min-width:118px}
.buck-stat .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.buck-stat .l{font-size:11px;color:var(--c-text-3);margin-top:2px}
.bucket{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden}
.bucket.confirmed{border-color:var(--c-success)}
.bucket-h{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.bucket-h .bk-key{font-size:14.5px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bucket-h .bk-cnt{font-size:12px;font-weight:500;color:var(--c-text-3)}
.bucket-h .bk-sub{font-size:12px;color:var(--c-text-3);margin-top:2px}
.bucket-h .spacer{flex:1}
.bk-type{font-size:11px;font-weight:600;padding:2px 9px;border-radius:6px;white-space:nowrap}
.bk-type.D{background:var(--c-p0-bg);color:var(--c-p0)}
.bk-type.veto{background:#E8684A22;color:#C0392B}
.bk-type.dim{background:var(--c-warning-bg);color:var(--c-warning)}
.bk-type.cand{background:#3B7DD822;color:#2F6BD0}
.bk-status{font-size:11px;padding:2px 9px;border-radius:6px;background:var(--c-surface-hover);color:var(--c-text-2);white-space:nowrap}
.bk-status.confirmed{background:var(--c-success-bg);color:var(--c-success)}
.bk-status.progress{background:var(--c-warning-bg);color:var(--c-warning)}
.bk-status.pending{background:#E0E0E0;color:#666}
.bk-status.excluded{background:#EEF0F2;color:#8A8F99}
.btn.susp{margin-left:8px;background:#FFF8E6;color:#B58105;border:1px solid #F0DC9E}
.btn.susp:hover{background:#FCEFC7}
.bk-type.hang{background:#FEF3E2;color:#B58105}
.bucket.hang-bucket{border-color:#F0DC9E}
.bk-trace.hung{background:#FFFBF2}
.bk-trace.hung:hover{background:#FCF6E8}
.tag.hung{background:#FEF3E2;color:#B58105;border:1px solid #F0DC9E}
.bk-trace.hung,.bk-trace.suspended{flex-wrap:wrap}
.bk-trace.hung .bk-reason,.bk-trace.suspended .bk-reason{width:100%}
.bk-trace.hung .sm-row,.bk-trace.suspended .sm-row{width:100%}
.bk-trace.suspended{background:#FFFDF8;opacity:.82}
.bk-trace.suspended:hover{background:#FCF6E8;opacity:1}
.bk-trace.suspended .bk-reason{background:#FFFDF5;border-style:solid}
.hang-inline-tip{font-size:11.5px;color:var(--c-text-3);line-height:1.5}
.hang-hint{font-size:11.5px;color:var(--c-text-3);padding:8px 16px 12px;line-height:1.6}
.dislike-box{margin-top:10px;padding:10px 12px;border:1px solid #F0C9B6;background:#FCEFE9;border-radius:8px}
.dislike-box .dislike-h{font-size:12px;font-weight:600;color:#B5531B;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dislike-box .dtag{font-size:11px;background:#C0392B;color:#fff;padding:2px 8px;border-radius:6px;white-space:nowrap}
.dislike-box .kv{margin-bottom:6px}
.dislike-box .kv:last-child{margin-bottom:0}
.bucket-body{padding:0 16px 6px;border-top:1px solid var(--c-border);display:none}
.bucket.open .bucket-body{display:block}
.bk-trace{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--c-border);font-size:12.5px;align-items:flex-start}
.bk-trace:last-child{border-bottom:none}
.bk-trace .bk-tid{font-family:ui-monospace,monospace;font-size:11px;color:var(--c-text-2);flex:0 0 94px}
.bk-trace .bk-utt{flex:1;color:var(--c-text);min-width:0}
.bk-trace .bk-resp{color:var(--c-text-3);font-size:11.5px;max-width:460px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
/*
 * HR-05 布局：tid | query/Response | 错误信息(第三列靠左) | … | meta(靠右)
 * 根因复盘：utt 若 flex:1 会把错误信息顶到按钮旁；改为 utt 限宽 + meta margin-left:auto，
 * 错误信息锚定在左侧第三列，登记态只影响最右侧 meta 内部。
 */
.bk-trace.hr05 .bk-utt{flex:0 1 460px;max-width:460px;min-width:0}
.bk-trace.hr05 .bk-err{flex:0 0 200px;width:200px;flex-shrink:0;align-self:flex-end;font-size:12px;line-height:1.45;color:var(--c-text-2)}
.bk-trace.hr05 .bk-err .bk-trigger-l{display:block;font-size:11px;color:var(--c-text-3);font-weight:500;margin-bottom:2px}
.bk-trace.hr05 .bk-err .bk-trigger-v{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c-text-2)}
.bk-trace.hr05 .bk-meta{flex:0 0 280px;width:280px;flex-shrink:0;margin-left:auto;justify-content:flex-end;flex-wrap:nowrap}
.bk-trace .bk-meta{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.bk-trace{cursor:pointer;transition:background .12s}
.bk-trace:hover{background:var(--c-surface-hover)}
.bk-trace .bk-tid{position:relative}
.bk-trace .bk-open{margin-left:4px;color:var(--c-primary);font-size:10px}
.bk-trace .bk-act{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.bk-actions{display:flex;gap:8px;padding:10px 16px;background:var(--c-surface-hover);border-top:1px solid var(--c-border)}
/* ── 问题看板：状态机 / 测评同步 ── */
.desc-cell{font-size:13px;color:var(--c-text);line-height:1.45}
.sync-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--c-text-2);background:var(--c-surface);border:1px solid var(--c-border);border-radius:8px;padding:9px 13px;margin-bottom:12px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--c-primary);flex:0 0 auto}
.status-flow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sf-step{font-size:12.5px;font-weight:600;padding:5px 14px;border:1px solid var(--c-border);border-radius:999px;background:var(--c-surface);color:var(--c-text-2)}
.sf-arrow{color:var(--c-text-3);font-size:13px}
/* ── 问题看板优化：过滤栏 + 紧凑表格 ── */
.ib-filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ib-filter-bar select{padding:7px 10px;border:1px solid var(--c-border);border-radius:8px;background:var(--c-surface);color:var(--c-text);font-size:12.5px;min-width:120px}
.ib-table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}
.ib-table th{background:var(--c-surface-hover);padding:9px 10px;font-size:12px;color:var(--c-text-3);font-weight:600;text-align:left;border-bottom:1px solid var(--c-border);white-space:nowrap}
.ib-table td{padding:10px;border-bottom:1px solid var(--c-border);vertical-align:top;font-size:12.5px}
.ib-table tr:hover td{background:var(--c-surface-hover)}
.ib-table .col-id{width:70px}
.ib-table .col-desc{width:auto;min-width:240px}
.ib-table .col-sev{width:62px}
.ib-table .col-status{width:74px}
.ib-table .col-source{width:78px}
.ib-table .col-sync{width:64px}
.ib-table .col-meta{width:120px}
.ib-table .col-act{width:84px}
/* ── 评测争议页 ── */
.dp-hint{font-size:12px;color:var(--c-text-2);line-height:1.65;margin:0}
.dp-batch{border:1px solid var(--c-border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px;background:var(--c-surface);cursor:pointer;transition:.12s}
.dp-batch:hover{border-color:var(--c-border-strong);background:var(--c-surface-hover)}
.dp-batch .bh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dp-batch .bh .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;color:var(--c-text)}
.dp-batch .bs{font-size:12.5px;color:var(--c-text-2);line-height:1.55}
.dp-batch .bm{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--c-text-3);flex-wrap:wrap}
.dp-score-trail{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--c-text-2)}
.dp-reason{font-size:12px;color:var(--c-text-2);line-height:1.45;max-width:280px}
.dp-reason .l{color:var(--c-text-3);font-size:11px}
.ib-id{font-family:var(--c-mono,monospace);font-size:12px;color:var(--c-text-2);font-weight:600}
.ib-title{font-size:13px;color:var(--c-text);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ib-meta{font-size:11.5px;color:var(--c-text-3);line-height:1.5}
.ib-meta b{font-weight:500;color:var(--c-text-2)}
.ib-actions{display:flex;gap:6px;justify-content:flex-end}
.ib-actions .btn{padding:4px 9px;font-size:11.5px}
/* ── 候选入池状态 ── */
.cand-bar{display:flex;gap:18px;align-items:center;margin-bottom:14px}
.cand-stat{display:flex;flex-direction:column;gap:2px}
.cand-stat .n{font-size:20px;font-weight:700}
.cand-stat .l{font-size:11px;color:var(--c-text-3)}

/* 评分详情弹窗modal */
.overlay{position:fixed;inset:0;background:rgba(20,22,26,.4);opacity:0;pointer-events:none;transition:.2s;z-index:1000}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.97);width:min(1480px,96vw);height:min(90vh,1000px);max-height:90vh;background:var(--c-surface);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.28),0 8px 28px rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:.22s cubic-bezier(.4,0,.2,1);z-index:1010;display:flex;flex-direction:column;overflow:hidden}
.drawer.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.dh{padding:14px 18px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.dh .t{font-size:14px;font-weight:600}
.dtabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--c-border)}
.dtab{padding:10px 12px;font-size:12.5px;color:var(--c-text-2);cursor:pointer;border-bottom:2px solid transparent}
.dtab:hover{color:var(--c-text)}
.dtab.active{color:var(--c-primary);border-bottom-color:var(--c-primary);font-weight:600}
/* ═══ Session 回放抽屉双页面 + 双栏联动四视图 ═══ */
.drawer-pages{display:flex;gap:2px;background:var(--c-surface-hover);border-radius:9px;padding:3px}
.dp{padding:6px 16px;font-size:12.5px;border:none;background:transparent;color:var(--c-text-2);cursor:pointer;border-radius:7px;font-weight:500;transition:.15s}
.dp:hover{color:var(--c-text)}
.dp.active{background:var(--c-surface);color:var(--c-primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sr-basic{display:flex;flex-wrap:wrap;gap:10px 22px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:10px}
.bi{display:flex;flex-direction:column;gap:2px}
.bk{font-size:10.5px;color:var(--c-text-3)}
.bv{font-size:13px;font-weight:600}
.sr-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sr-jump{display:inline-flex;gap:4px;align-items:center}
.sr-j{cursor:pointer;background:var(--c-surface-hover);border:1px solid var(--c-border);border-radius:5px;padding:1px 8px;font-size:12px}
.sr-j:hover{border-color:var(--c-primary)}
.sr-j.on{border-color:var(--c-primary);color:var(--c-primary);font-weight:600}
.sr-compl{margin-left:auto}
.sr-2col{display:grid;grid-template-columns:1.6fr 0.95fr;gap:14px;align-items:start}
.sr-left{min-width:0}
.sr-right{display:flex;flex-direction:column;gap:12px;align-self:start;padding-right:2px}
.sr-card-h{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.sr-card-h .t{font-size:13px;font-weight:600}
.sr-card-h .chev{font-size:11px;color:var(--c-text-3);transition:.15s}
.sr-card-h.collapsed .chev{transform:rotate(-90deg)}
.sr-card-body{max-height:360px;overflow-y:auto;transition:max-height .2s ease}
.sr-card-body.collapsed{max-height:0;overflow:hidden;padding-top:0;padding-bottom:0}
.sr-empty-field{display:none}
.sr-basic{gap:8px 18px;padding:8px 12px}
.sr-basic .bi{gap:1px}
.sr-basic .bk{font-size:10px}
.sr-basic .bv{font-size:12px;font-weight:500}
.turn{cursor:pointer;border:1px solid var(--c-border);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:10px;background:var(--c-surface);transition:.15s}
.turn:hover{border-color:var(--c-primary)}
.turn.active{border-color:var(--c-primary);box-shadow:0 0 0 2px var(--c-primary-bg)}
.turn.timeout,.turn.miss{border-color:var(--c-danger);background:color-mix(in srgb,var(--c-danger-bg) 45%,var(--c-surface))}
.turn.problem{border-color:var(--c-warning);background:color-mix(in srgb,var(--c-warning-bg) 55%,var(--c-surface))}
.turn.problem.active{border-color:var(--c-warning);box-shadow:0 0 0 2px var(--c-warning-bg)}
.tag.problem{background:var(--c-warning-bg);color:var(--c-warning);font-weight:600}
.sr-j.problem{border-color:var(--c-warning);color:var(--c-warning);background:var(--c-warning-bg)}
.turn-flag{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--c-primary-bg);color:var(--c-primary);font-weight:600;white-space:nowrap}
.turn-meta{font-size:11px;color:var(--c-text-3);margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.turn-act{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--c-border);align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.turn.active .turn-act{display:flex}
.turn-act .hint{font-size:11.5px;color:var(--c-text-3);flex:1;min-width:120px}
.card.sync .card-b{padding:10px 12px;max-height:38vh;overflow-y:auto}
/* 小屏幕适配：窄屏下取消两栏横排与右栏 sticky 限制，改为单列堆叠，由抽屉整体滚动 */
@media (max-width:1080px){
  .sr-2col{grid-template-columns:1fr;gap:12px}
  .card.sync .card-b{max-height:none}
}
.wf{border:1px solid var(--c-border);border-radius:7px;margin-bottom:8px;overflow:hidden}
.wf-h{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;background:var(--c-surface-hover);font-size:12.5px}
.wf-h:hover{background:var(--c-border)}
.wf-ico{font-weight:700;flex:0 0 auto}
.wf-ico.ok{color:var(--c-success)}
.wf-ico.no{color:var(--c-danger)}
.wf-name{font-weight:600;flex:0 0 auto}
.wf-sum{flex:1;color:var(--c-text-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-time{color:var(--c-text-3);font-size:11px;flex:0 0 auto}
.wf-exp{display:none;padding:8px 10px;border-top:1px solid var(--c-border);background:var(--c-surface)}
.wf-exp.show{display:block}
.wf-group{margin-bottom:13px}
.wf-group:last-child{margin-bottom:0}
.wf-group-h{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--c-text-2);margin:2px 0 7px;padding-left:2px}
.wf-group-n{background:var(--c-surface);border:1px solid var(--c-border);border-radius:9px;padding:0 7px;font-size:10.5px;color:var(--c-text-3);font-weight:600;min-width:18px;text-align:center}
.wf-row{display:flex;gap:8px;margin-bottom:5px;font-size:11.5px;line-height:1.5}
.wf-row .wk{flex:0 0 52px;color:var(--c-text-3);white-space:nowrap}
.wf-row code{flex:1;font-family:ui-monospace,Menlo,monospace;color:var(--c-text-2);word-break:break-all;white-space:pre-wrap}
.wf-row.col{align-items:flex-start}
.wf-row.col .know-list{flex:1;display:flex;flex-direction:column;gap:4px}
.know-item{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--c-surface-hover);border-radius:6px;font-size:11px}
.ki-title{font-weight:600;color:var(--c-text)}
.ki-doc{color:var(--c-text-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbody{flex:1;min-height:0;overflow-y:auto;padding:18px}
.dfoot{padding:12px 18px;border-top:1px solid var(--c-border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.bubble{max-width:min(82%,820px);padding:9px 13px;border-radius:12px;margin-bottom:10px;font-size:12.5px;line-height:1.55}
.bubble.u{background:var(--c-primary-bg);color:var(--c-text);margin-left:auto;border-bottom-right-radius:3px}
.bubble.a{background:var(--c-surface-hover);color:var(--c-text);border-bottom-left-radius:3px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--c-border);font-size:12.5px}
.kv .k{color:var(--c-text-3)}
.kv-exp{cursor:pointer}
.kv-exp:hover{background:var(--c-surface)}
.kv-exp .exp-hint{font-size:10px;color:var(--c-accent);margin-left:5px;font-weight:400}
.cart-exp{padding-top:6px;padding-bottom:8px}
.cart-list{display:flex;flex-direction:column;gap:5px}
.cart-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 9px;background:var(--c-bg);border:1px solid var(--c-border);border-radius:7px}
.ci-idx{flex:0 0 auto;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:var(--c-accent);color:#fff;font-size:10px}
.ci-name{flex:0 0 auto;font-weight:600;color:var(--c-text-1)}
.ci-spec{flex:1 1 auto;color:var(--c-text-3);font-size:11.5px;min-width:0}
.ci-qty{flex:0 0 auto;color:var(--c-text-1);font-weight:600}
.ci-price{flex:0 0 auto;color:var(--c-accent);font-size:11.5px}
.ci-sku{flex:0 0 auto;color:var(--c-text-3);font-size:10px}
/* 模型视角：检索知识 chunk 区块 */
.mv-chunks{margin-top:10px;border-top:1px solid var(--c-border);padding-top:9px}
.mv-sub{font-size:11.5px;color:var(--c-text-3);margin-bottom:7px;font-weight:600}
.mv-chunk{border:1px solid var(--c-border);border-radius:6px;padding:7px 9px;margin-bottom:6px;background:var(--c-surface)}
.mv-chunk-h{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:4px;flex-wrap:wrap}
.mv-chunk-h .mono{color:var(--c-text-3);font-size:11px}
.mv-title{font-weight:600;color:var(--c-text)}
.mv-doc{color:var(--c-primary);font-size:11px;background:var(--c-primary-bg);padding:0 6px;border-radius:4px}
.mv-score{color:var(--c-text-3);font-size:11px;margin-left:auto}
.mv-snippet{font-size:12px;color:var(--c-text-2);line-height:1.55}
.dim{font-size:12px;color:var(--c-text-3);line-height:1.6}
.trace-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--c-border)}
/* 一条 trace 可登记多个 Issue：行内「已登记·N ▾」可展开查看全部关联 Issue */
.ti-wrap{position:relative;display:inline-block}
.ti-pop{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:264px;background:#fff;border:1px solid var(--c-border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px;font-size:12px;line-height:1.5}
.ti-pop.show{display:block}
.ti-pop .ti-h{font-weight:600;color:var(--c-text,#1d2129);margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed var(--c-border)}
.ti-pop .ti-row{padding:6px 4px;cursor:pointer;border-radius:6px}
.ti-pop .ti-row:hover{background:#f6f8fa}
.ti-pop .ti-row .ti-id{font-weight:600;color:#165DFF}
.ti-pop .ti-row .ti-desc{color:var(--c-text-3,#86909c);margin-top:2px}
.dm-hint{font-size:12px;color:var(--c-text-2,#4e5969);background:#f6f8fa;border:1px dashed var(--c-border);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.tl-item{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-family:var(--c-mono,monospace);padding:3px 8px;border:1px solid var(--c-border);border-radius:6px;background:var(--c-surface);color:var(--c-text-2);cursor:pointer}
.tl-item:hover{border-color:var(--c-primary);color:var(--c-primary)}
.empty{padding:40px;text-align:center;color:var(--c-text-3)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.35}
.note{font-size:12px;color:var(--c-text-3);margin-top:10px;line-height:1.6}
.flag{display:inline-block;background:var(--c-warning-bg);color:var(--c-warning);font-size:11px;padding:1px 7px;border-radius:5px;margin-left:6px}
.sec-title{font-size:13px;font-weight:600;margin:18px 0 10px;color:var(--c-text)}
.select{border:1px solid var(--c-border);border-radius:var(--radius-sm);height:32px;padding:0 10px;font-size:12.5px;background:var(--c-surface);outline:none;color:var(--c-text)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--c-text-3);margin-top:8px;align-items:center}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}

/* sub-tabs */
.sub-tabs{display:flex;gap:0;border-bottom:1px solid var(--c-border);margin-bottom:16px}
.sub-tab{padding:8px 16px;font-size:12.5px;color:var(--c-text-2);cursor:pointer;border-bottom:2px solid transparent}
.sub-tab:hover{color:var(--c-text)}
.sub-tab.active{color:var(--c-primary);border-bottom-color:var(--c-primary);font-weight:600}

/* filter row */
.filter-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.filter-row select,.filter-row input{height:32px;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:0 10px;font-size:12px;background:var(--c-surface);outline:none}
.filter-row input{width:200px}

/* expand row */
.expand-row{display:none}
.expand-row.show{display:table-row}
.expand-cell{background:var(--c-surface-hover);padding:12px 14px!important}

/* selection counter */
.sel-count{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--c-text-2)}
.sel-count b{color:var(--c-primary);font-size:13px}

/* modal */
#modalRoot{display:none;position:fixed;inset:0;z-index:1100}
.modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center}
.modal{width:430px;max-width:92vw;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.modal-h{padding:14px 16px;font-weight:600;font-size:14px;border-bottom:1px solid var(--c-border)}
.modal-b{padding:16px}
.fld{margin-bottom:13px;display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;color:var(--c-text-2)}
.fld input,.fld select{height:32px;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:0 10px;font-size:13px;background:var(--c-bg);color:var(--c-text);outline:none}
.fld input[readonly]{background:var(--c-surface-hover);color:var(--c-text-3)}
.modal-hint{font-size:12px;color:var(--c-text-3);background:var(--c-bg);padding:9px 11px;border-radius:var(--radius-sm);line-height:1.5}
.modal-f{padding:12px 16px;border-top:1px solid var(--c-border);display:flex;justify-content:flex-end;gap:8px}
.modal-textarea{width:100%;height:64px;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical;box-sizing:border-box;background:#fff;color:var(--c-text);outline:none}
.modal-textarea:focus{border-color:var(--c-primary)}
.modal-tip{font-size:12.5px;color:var(--c-text-3);line-height:1.6;margin:0 0 10px}
.modal-err{font-size:12px;color:#C0392B;margin-top:6px;display:none}
.bk-reason{font-size:12px;color:var(--c-text-2);margin-top:7px;line-height:1.5;background:#FFFBF2;border:1px dashed #F0DC9E;border-radius:6px;padding:6px 9px}
.bk-reason-l{color:#B58105;font-weight:500}
/* toast */
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:var(--c-text);color:#fff;padding:10px 18px;border-radius:var(--radius-md);font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s;z-index:1200;display:flex;align-items:center;gap:8px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .gd{color:#F7C948}
/* golden 页 */
.from-tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:var(--c-surface-hover);color:var(--c-text-2);border:1px solid var(--c-border)}
.set-tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:#FBF1E0;color:#8A5710;border:1px solid #E7CfA0}
.gd-consistent{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c-text-3);opacity:.35;margin-right:6px;vertical-align:middle}
/* golden 集合胶囊行 */
.gset-tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.gd-arch{opacity:.55}
.gset-new{padding:6px 13px;border:1px dashed var(--c-border-strong);border-radius:20px;font-size:12.5px;color:var(--c-text-2);background:var(--c-surface);cursor:pointer;transition:.12s}
.gset-new:hover{border-color:var(--c-primary);color:var(--c-primary)}
/* golden 集合选择弹窗 */
.gset-picker{display:flex;flex-direction:column;gap:8px;margin:10px 0;max-height:230px;overflow-y:auto}
.gset-opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--c-border);border-radius:var(--radius-md);cursor:pointer;transition:.12s}
.gset-opt:hover{border-color:var(--c-border-strong);background:var(--c-surface-hover)}
.gset-opt:has(input:checked){border-color:var(--c-primary);background:var(--c-primary-bg)}
.gset-opt input{margin:0;flex-shrink:0}
.gset-opt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gset-opt-name{font-size:13px;color:var(--c-text);font-weight:500}

/* 悬挂重跑：通过累计连续次数，≥3 自动软淘汰；不通过自动进入评测争议，无需人工再点 */
const HANG_PASS_NEED=3;
function ensureHangFields(t){
  if(t._passStreak==null) t._passStreak=0;
  if(!t._rerunScores) t._rerunScores=[];
  if(t._failCount==null) t._failCount=0;
}
function softEliminateHang(t, reason){
  t.state='eliminated';
  t._elimReason=reason||'连续重跑通过';
  t._elimAt=nowStr();
  removeFromSuspended(t.trace);
  DATA.eliminated=DATA.eliminated||[];
  if(!DATA.eliminated.find(x=>x.trace===t.trace)) DATA.eliminated.push(t);
}
function autoEnterDisputeFromRerunFail(t, newScore){
  ensureHangFields(t);
  const id='DSP-'+String(100+((DATA.disputes||[]).length+1)).padStart(3,'0');
  DATA.disputes=DATA.disputes||[];
  DATA.disputes.unshift({
    id, trace:t.trace, utter:t.utter, resp:t.resp,
    hangReason:t._reason||'',
    exemptReason:'悬挂重跑未通过，系统自动转入评测争议',
    by:t._suspendedBy||CUR_USER, at:nowStr(),
    firstScore:t._firstScore!=null?t._firstScore:t.score,
    rerunScores:(t._rerunScores||[]).slice(),
    status:'待分析', dim:t._dim||'', ruleHint:'',
    enterVia:'rerun_fail'
  });
  t.state='disputed';
  t.score=newScore;
  removeFromSuspended(t.trace);
  updateDisputeBadge();
}
function rerunHangOne(trace, pass){
  const t=findSuspended(trace); if(!t){toast('未找到悬挂案例');return;}
  ensureHangFields(t);
  if(t._firstScore==null) t._firstScore=t.score;
  const base=t.score!=null?Number(t.score):3;
  const newScore=pass ? Math.min(5, Math.round((Math.max(base, 3.2)+0.3)*10)/10) : Math.max(1, Math.round((Math.min(base, 3.0)-0.2)*10)/10);
  t._rerunScores.push(newScore);
  t.score=newScore;
  t._lastRerunAt=nowStr();
  t._lastRerunPass=!!pass;
  if(pass){
    t._passStreak=(t._passStreak||0)+1;
    if(t._passStreak>=HANG_PASS_NEED){
      softEliminateHang(t, '连续重跑通过');
      toast(trace+' 连续通过 '+HANG_PASS_NEED+' 次，已自动淘汰');
    }else{
      toast(trace+' 重跑通过，连续通过 '+t._passStreak+'/'+HANG_PASS_NEED);
    }
  }else{
    t._passStreak=0;
    t._failCount=(t._failCount||0)+1;
    autoEnterDisputeFromRerunFail(t, newScore);
    toast(trace+' 重跑未通过，已转入评测争议样本列表');
  }
  if(CUR_PAGE==='prdbad') renderBadBuckets();
  else if(CUR_PAGE==='dispute') show('dispute');
  else updateDisputeBadge();
}
function rerunHangBatch(pass){
  const list=(DATA.suspended||[]).slice();
  if(!list.length){ toast('悬挂中暂无案例'); return; }
  list.forEach(t=>rerunHangOne(t.trace, pass));
}

function openIssueModal(cur, linkBC){
  const m = cur ? caseMeta(cur) : {no:'tr_demo_001', score:3.6, via:'随机采样'};
  ISSUE_LINK_BC = (linkBC&&linkBC.length)?linkBC:null;
  const ruleHit = !!(cur && cur.via && String(cur.via).indexOf('规则')>=0);
  const fromReplay = !!(cur && (cur._round || cur.via==='会话回放'));
  const jr = judgeResultMock(m.no);   /* 直接消费 judge 真实返回：pass 三态 + violated_rules + 维度分 + overall */
  const low = jr.low;
  let path, autoDesc=null, violated=jr.violated;
  if(fromReplay){ path='boundary'; autoDesc=null; }  /* 回放按轮人工登记：跳过 pass 拦截，强制人工描述 */
  else if(ruleHit){ path='rule'; autoDesc=ruleDesc(cur); }
  else if(jr.pass==='true'){ path='pass'; }   /* judge 判通过 → 飞轮放过，不进入问题登记 */
  else if(jr.pass==='false'){
    const strong = !!violated || low.s <= 3;   /* 强信号：命中否决 或 任一维度≤3 → 确定负，自动绑定问题描述 */
    if(strong){ path='judge'; autoDesc = violated ? ('命中一票否决「'+violated+'」，模型响应不符合规范') : ('「'+low.cn+'」维度评分仅 '+low.s+'，未达预期'); }
    else { path='boundary'; autoDesc=null; }  /* 弱信号：pass=false 但仅 overall<4，无具体硬伤 → 人工填写问题描述 */
  }

function hashStr(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h;}
/* judge 打分结果 mock：直接消费真实接口应返回的字段 —— pass 三态 + 命中否决规则 + 六维分 + overall。 */
function judgeResultMock(id){
  const dims=judgeDimsMock(id);
  const violated=judgeViolatedMock(id);
  const low=dims.reduce((a,b)=>b.s<a.s?b:a, dims[0]);
  const overall=Math.round(dims.reduce((s,d)=>s+d.s,0)/dims.length*10)/10;
  let pass;
  if(violated || low.s<=3) pass='false';
  else if(overall<4) pass='false';
  else pass= overall>=4.5 ? 'true' : 'MANUAL';
  return {pass, violated, low:{s:low.s, cn:low.cn, dim:low.dim}, dims, overall};
}
function judgeDimsMock(id){
  let h=hashStr(id)||1;
  return JUDGE_DIMS.map(d=>{ h=(h*1103515245+12345)>>>0; const sc=1+((h>>>4)%45)/10; return {dim:d, cn:JUDGE_DIM_CN[d], s:Math.round(sc*10)/10}; });
}
function judgeViolatedMock(id){
  let h=hashStr(id+'_veto')||7;
  return ((h>>>3)%3===0) ? VETO_RULES[h % VETO_RULES.length] : null;
}
function ruleDesc(cur){
  const t=String(cur.tag||'')+String(cur.rule||'')+String(cur.suggest||'');
  if(t.indexOf('空')>=0||t.indexOf('无输出')>=0) return '命中 HR-06 模型输出为空，Agent 无最终响应';
  if(t.indexOf('转人工')>=0) return '命中 HR-02 用户要求转人工';
  if(t.indexOf('放弃')>=0||t.indexOf('遗忘')>=0||t.indexOf('上下文')>=0) return '命中 HR-03 多轮后放弃下单';
  if(t.indexOf('点踩')>=0) return '命中 HR-01 用户主动点踩';
  if(t.indexOf('子')>=0||t.indexOf('Agent')>=0) return '命中 HR-05 子 Agent 失败';
  return '命中 HR-04 Agent 执行异常';
}

function submitIssue(no, isBoundary, autoMode){
  // 关联到现有 Issue 模式人工评审 / 强信号均可选择并入已有问题，不新建
  const modeEl=document.getElementById('issMode');
  const linkEl=document.getElementById('issLink');
  if(modeEl && modeEl.value==='link' || (linkEl && linkEl.value)){
    const linkId=linkEl?linkEl.value:'';
    if(linkId){
      const iss=DATA.issues.find(x=>x.id===linkId);
      if(!iss){ toast('未找到该 Issue'); return; }
      const sr=collectSafeReject();
      if(sr===null) return;
      if(sr&&sr.hit){ const q=DATA.qualityMetrics.find(x=>x.key==='safe_reject'); if(q) q.cur=(q.cur||0)+1; iss.safeReject=true; iss.safeWords=(iss.safeWords?iss.safeWords+'; ':'')+sr.words; iss.severity='严重'; }
      const linked=(ISSUE_LINK_BC&&ISSUE_LINK_BC.length)?ISSUE_LINK_BC.slice():[no];
      linked.forEach(t=>{ if(iss.linkedBC.indexOf(t)<0) iss.linkedBC.push(t); const bc=DATA.prdbad.find(x=>x.trace===t); if(bc) bc.issueId=iss.id; registerTrace(t, iss.id); });
      iss.cases=iss.linkedBC.length;
      if(ADOPT_PENDING){ const ac=DATA.candidates.find(x=>x.trace===ADOPT_PENDING); if(ac){ ac.status='已采纳'; pushCandLog(ADOPT_PENDING,'采纳','待确认 → 已采纳，关联到 '+linkId); renderCand(CAND_PAGE); } ADOPT_PENDING=null; }
      ISSUE_LINK_BC=null;
      closeModal();
      toast('已关联到现有 Issue '+linkId+(sr&&sr.hit?'，越界回答已标记为严重':'')+'，移交测评平台待路由');
      if(!refreshReplayIfOpen()) show('issue');
      return;
    }
  }
  const descEl=document.getElementById('issDesc');
  const desc = descEl ? descEl.value.trim() : '';
  const linkedMode = (modeEl && modeEl.value==='link') || (linkEl && linkEl.value);
  if(!linkedMode && !desc){ toast('请填写问题描述'); return; }
  const sr=collectSafeReject();
  if(sr===null) return;
  if(sr&&sr.hit){ const q=DATA.qualityMetrics.find(x=>x.key==='safe_reject'); if(q) q.cur=(q.cur||0)+1; }
  const sevEl=document.getElementById('issSev');
  const severity = sevEl ? sevEl.value : '一般';
  const seq = 2045+DATA.issues.length;
  const id='ISS-'+seq;
  const linked = (ISSUE_LINK_BC&&ISSUE_LINK_BC.length)?ISSUE_LINK_BC.slice():[];
  const srcType = autoMode ? (ISSUE_PATH==='rule'?'rule':'judge') : (isBoundary?'boundary':'judge');
  const srcDetail = autoMode ? ('强信号入池   关联 trace') : (isBoundary?'judge 六维总分 3.x边界':('登记来源   '+(linked.length?linked[0]:no)));
  // 主问题 issue即人工登记 / 采纳确立的问题本身
  const mainIssue={id,title:desc,desc,human:!autoMode,srcType,srcDetail,cases:Math.max(1,linked.length),severity,owner:'待路由',status:'待处理',creator:CUR_USER,created:todayStr(),linkedBC:linked,fromBC:linked.length>0,fromCand:!!ADOPT_PENDING, safeReject:false, safeWords:''};
  linked.forEach(t=>{ const bc=DATA.prdbad.find(x=>x.trace===t); if(bc) bc.issueId=id; registerTrace(t, id); });
  let safeId=null;
  if(sr&&sr.hit){
    // 越界回答行为 = 是 → 拆分出第二个同级 issue，描述即人工填写的敏感词 / 场景
    safeId='ISS-'+(seq+1);
    const safeDesc=sr.words;
    const safeIssue={id:safeId, title:'越界回答：'+(safeDesc.length>36?safeDesc.slice(0,36)+'…':safeDesc), desc:safeDesc, human:!autoMode, srcType:'safe_reject', srcDetail:'登记来源   越界回答'+(linked.length?linked[0]:no)+'', cases:Math.max(1,linked.length), severity:'严重', owner:'待路由', status:'待处理', creator:CUR_USER, created:todayStr(), linkedBC:linked.slice(), fromBC:linked.length>0, fromCand:!!ADOPT_PENDING, safeReject:true, safeWords:safeDesc};
    linked.forEach(t=>{ registerTrace(t, safeId); });
    DATA.issues.unshift(safeIssue);   // 先入栈 safe，再入栈 main → 主问题在顶部、越界回答 issue 紧随其下二者同级
    DATA.issues.unshift(mainIssue);
  } else {
    DATA.issues.unshift(mainIssue);
  }
  if(ADOPT_PENDING){
    const ac=DATA.candidates.find(x=>x.trace===ADOPT_PENDING);
    if(ac){
      ac.status='已采纳';
      pushCandLog(ADOPT_PENDING,'采纳','待确认 → 已采纳，直接登记为问题');
      addCandidateBucket(ac, id, desc);
      renderCand(CAND_PAGE);
    }
    ADOPT_PENDING=null;
  }
  ISSUE_LINK_BC=null;
  closeModal();
  toast('已登记 '+id+(safeId?('，并拆分出越界回答 Issue '+safeId):'')+(linked.length?('，关联 '+linked.length+' 个 Bad Case'):'')+'，移交测评平台待路由');
  if(!refreshReplayIfOpen()) show('issue');
}

function createGoldenSet(inPicker){
  const inputId=inPicker?'gsNewInline':'gsName';
  const el=document.getElementById(inputId);
  const name=(el&&el.value||'').trim();
  if(!name){ toast('请输入集合名称'); if(el)el.focus(); return; }
  if(GOLDEN_SETS.some(s=>s.name===name)){ toast('已存在同名集合'); return; }
  const id='gs_'+Math.abs(hashCode(name+Date.now()));
  const desc=inPicker?'':((document.getElementById('gsDesc')||{}).value||'').trim();
  GOLDEN_SETS.push({id, name, desc});
  if(inPicker){
    // 内联新建后，回到加入弹窗并自动选中新集合
    openGoldenPicker();
    const r=document.querySelector(`input[name="gsPick"][value="${id}"]`); if(r)r.checked=true;
    toast(`已创建集合「${name}」`);
  }else{
    closeModal();
    toast(`已创建集合「${name}」`);
    if(CUR_PAGE==='golden'){ curGoldenSet=id; show('golden'); }
  }
}
function selectGoldenSet(id){ curGoldenSet=id; show('golden'); }
function addSelectedToGolden(){
  if(SELECTED.length===0){ toast('请先在列表中勾选用例'); return; }
  queueGolden(SELECTED.map(s=>({...s})), '测试案例');
}
function removeGolden(id){
  GOLDEN=GOLDEN.filter(g=>g.id!==id);
  GD_SELECTED.delete(id);
  updateGoldenBadge();
  rerenderGolden();
  toast('已删除 1 条 Golden 用例');
}

function trendSvg(){const w=520,h=120,pad=10,max=100,min=88;

function hitTrendSvg(){const data=DATA.ruleHitTrend,days=DATA.ruleHitDays;const w=360,h=124,pad=12,max=Math.max(...data)*1.18;const pts=data.map((v,i)=>{const x=pad+i*(w-2*pad)/(data.length-1);const y=h-pad-(v/max)*(h-2*pad);return[x,y];});const line=pts.map(p=>p.join(',')).join(' ');const area=`${pad},${h-pad} `+line+` ${w-pad},${h-pad}`;const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--c-primary)"/><text x="${p[0]}" y="${p[1]-7}" font-size="9" fill="var(--c-text-3)" text-anchor="middle">${data[i]}</text>`).join('');const xlab=days.map((d,i)=>`<text x="${pad+i*(w-2*pad)/(data.length-1)}" y="${h-1}" font-size="8" fill="var(--c-text-3)" text-anchor="middle">${d.slice(3)}</text>`).join('');return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:130px"><polygon points="${area}" fill="var(--c-primary-bg)"/><polyline points="${line}" fill="none" stroke="var(--c-primary)" stroke-width="2"/>${dots}<text x="${pad}" y="10" font-size="9" fill="var(--c-text-3)">${max.toFixed(0)}</text>${xlab}</svg>`;}
function donutSvg(segs,size=132,centerVal=null,centerSub='Bad Case'){
  const total=segs.reduce((s,x)=>s+x.value,0);
  const cx=size/2, cy=size/2, r=size/2-16, sw=16;
  const cv=centerVal==null?total:centerVal;
  let a0=-Math.PI/2, parts='';
  segs.forEach(s=>{
    const a1=a0+(s.value/total)*Math.PI*2;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const large=(a1-a0)>Math.PI?1:0;
    const oc = s.onclick ? ` class="donut-seg" onclick="${s.onclick}"` : '';
    parts+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${s.color}" stroke-width="${sw}"${oc}/>`;
    a0=a1;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">${parts}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="21" font-weight="700" fill="var(--c-text)">${cv}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="var(--c-text-3)">${centerSub}</text></svg>`;
}

/* ── 兜底话术触发率：mini spark每行   方向色暗示较上一日走势── */
function fbSpark(trend, color, dir){
  const n=trend.length;
  const max=Math.max.apply(null, trend);
  const min=Math.min.apply(null, trend);
  const W=130,H=30,padL=2,padR=6,padT=5,padB=5;
  const range = (max-min) || max || 0.001;
  const x=i=> padL+(W-padL-padR)*(n<=1?0.5:i/(n-1));
  const y=v=> padT+(H-padT-padB)*(1-(v-min)/range);
  const path=trend.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=path+` L ${x(n-1).toFixed(1)} ${(H-padB).toFixed(1)} L ${x(0).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  const last=trend[n-1];
  const tipColor = dir==='up' ? '#D4380D' : (dir==='down' ? '#1A8F4E' : '#6B7280');
  const tipSign = dir==='up' ? '▲' : (dir==='down' ? '▼' : '–');
  const lx = x(n-1).toFixed(1);
  const ly = y(last).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${area}" fill="${color}" opacity="0.10"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${lx}" cy="${ly}" r="2.4" fill="${tipColor}"/>
    <text x="${lx}" y="${ly-4}" text-anchor="middle" font-size="7" fill="${tipColor}" font-weight="700">${tipSign}</text>
  </svg>`;
}

function synth30(t7){
  const out=[];
  for(let k=0;k<30;k++){
    const a=t7[k%7], b=t7[(k+1)%7], f=k%7/7, w=1+0.06*Math.sin(k*0.45);
    out.push(Math.min(1, Math.max(0, (a*(1-f)+b*f)*w)));

  return out;
}

function confBarsHtml(arr, type){
  const totalLow=arr.reduce((s,x)=>s+x.low,0);
  const maxSam=Math.max(1,...arr.map(z=>z.total));
  const scale=132;
  const rows=arr.slice().sort((a,b)=>intentOrderIdx(a.code)-intentOrderIdx(b.code)).map(x=>{
    const rate=x.rate;

    const rc=rate>=0.05?'rate-high':rate>=0.03?'rate-mid':'rate-low';
    const hs=Math.max(2,(x.total/maxSam*scale)).toFixed(0);
    const he=Math.max(2,(x.low/maxSam*scale)).toFixed(0);
    return `<div class="imcc-grp" onclick="openConfModal('${type}','${x.code}')" title="点击查看 ${x.name} 明细、趋势与典型案例">
      <div class="imcc-rate ${rc}">${ratePct}%</div>
      <div class="imcc-bars">
        <div class="imcc-col"><span class="imcc-cnt">${x.total}</span><span class="imcc-bar imcc-samp" style="height:${hs}px"></span></div>
        <div class="imcc-col"><span class="imcc-cnt err ${rc}">${x.low}</span><span class="imcc-bar imcc-err ${rc}" style="height:${he}px"></span></div>
      </div>
      <div class="imcc-name">${x.name}</div>
    </div>`;
  }).join('');
  return `<div class="imcc">${rows}</div>
    <div class="imcc-legend"><span><i style="background:#C2CEDC"></i>全量turn数</span><span><i style="background:linear-gradient(90deg,#D4380D,#E08A00,#3FA66A)"></i>低置信turn数</span></div>

}

}

function exportGolden(){
  const rows=curGoldenSet==='all'?GOLDEN:GOLDEN.filter(x=>x.set===curGoldenSet);
  if(!rows.length){ toast('当前集合暂无用例可导出'); return; }
  const head = ['用例编号','query','Response','集合','模型路由路径','标注结果','操作人','加入时间'];
  const body = rows.map(r=>{
    const model = r.model || null;
    const modelRes = model ? pathLabel(model, r.model_router) : '—';
    const annoRes = model ? pathLabel(model, r.correct) : '—';
    return [r.id, r.text, r.resp, goldenSetName(r.set), modelRes, annoRes, r.by, r.at];
  });
  downloadCsv(head, body, curGoldenSet==='all'?'golden_all':curGoldenSet);
  rows.forEach(r=>r.exported=true);
  toast('已导出 '+rows.length+' 条 Golden 用例CSV  已自动打标归档');
  if(CUR_PAGE==='golden') show('golden');
}
function downloadCsv(head, rows, name){
  const esc = v => ('"'+String(v==null?'':v).replace(/"/g,'""')+'"');
  const lines = [head.map(esc).join(','), ...rows.map(r=>r.map(esc).join(','))];
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function sortBy(btn){
  const page=btn.dataset.page, key=btn.dataset.key, arr=SORT_ARR[page];
  if(!arr)return;
  const dir=(SORT_STATE.key===key&&SORT_STATE.dir==='asc')?'desc':'asc';
  SORT_STATE={page,key,dir};
  arr.sort((a,b)=>{
    let x=a[key], y=b[key];
    if(x==null||y==null)return 0;
    if(typeof x==='string') return dir==='asc'?String(x).localeCompare(String(y),'zh'):String(y).localeCompare(String(x),'zh');
    return dir==='asc'? x-y : y-x;
  });
  show(page);
}

/* 初始化：强信号 Bad Case 桶按「桶状态」联动自动建 Issue 与 Trace 登记态。
   未处理：暂不建 Issue、桶内 Trace 全部未登记；
   处理中：建 Issue关联首条 trace、首条 Trace 已登记，其余未登记部分确认；
   已建单：建 Issue关联全部 trace、桶内 Trace 全部已登记。
   候选采纳桶fromCand已自带 Issue 与「已建单」状态，跳过。 */
function initBadBucketIssues(){
  DATA.badBuckets.forEach(b=>{
    if(b.type==='sm'){ return; }  // 小模型桶：运营标注 → Golden 回流，不入 Issue 闭环
    if(b.fromCand){ b.traces.forEach(t=>{ t.issRegistered=true; }); return; }  // 候选采纳桶已建单，全部 Trace 已登记
    b.traces.forEach(t=>{ if(t.issRegistered===undefined) t.issRegistered=false; });
    const sev=(b.key.indexOf('HR-0')===0||b.type==='veto')?'严重':'一般';
    if(b.status==='未处理'||b.status==='待处理') return;   // 未处理/待处理桶暂不建 Issue、Trace 全部未登记原始待分拣队列，等人工介入
    if(b.issueId) return;
    const iid='ISS-'+(2045+DATA.issues.length);
    const linked = b.status==='处理中'
      ? [b.traces[0].trace]                               // 处理中：部分确认，仅首条入 Issue
      : b.traces.map(t=>t.trace);                         // 已建单：全部关联
    DATA.issues.unshift({id:iid,title:b.key,desc:b.key,srcType:b.type==='D'?'rule':'judge',srcDetail:'强信号自动入池   关联 '+linked.length+' 条 trace',cases:linked.length,severity:sev,owner:'待路由',status:'待处理',creator:'SYSTEM',created:todayStr(),linkedBC:linked,fromBC:true,fromCand:false});
    b.issueId=iid;
    b.traces.forEach((t,i)=>{ t.issRegistered = (b.status==='处理中') ? (i===0) : true; });
  });
}

function smBucketCard(b){

function smTrace(b){
  const f = b._filter||'todo';
  let list = b.traces.slice();
  if(f==='todo') list = list.filter(t=>!t.correct);
  else if(f==='done') list = list.filter(t=>t.correct);
  list.sort((a,b2)=>{
    const aDone=!!a.correct, bDone=!!b2.correct;
    if(aDone!==bDone) return aDone?1:-1;
    const aMis = a.correct&&a.correct===a.model_router, bMis=b2.correct&&b2.correct===b2.model_router;
    if(aMis!==bMis) return aMis?-1:1;
    return (b2.score||0)-(a.score||0);
  });
  return list.map(t=>{
    const mis = t.correct && t.correct===t.model_router;
    const stCls = !t.correct ? 'pending' : 'done';
    let badge, action;
    if(!t.correct){
      const isIntent = b.model==='intent';
      const opts = `<option value="">请选择</option>` + SM_PATHS()[b.model].map(p=>`<option value="${p.code}">${p.label}</option>`).join('');
      /* 意图路由模型：主意图选「商品推荐」时联动二级子推荐意图下拉；默认隐藏，选推荐才出现 */
      const recSubOpts = SM_PATHS().recommend.map(p=>`<option value="${p.code}">${p.label}</option>`).join('');
      const subWrap = isIntent
        ? `<span class="sm-subwrap" id="subwrap_${b.id}_${t.trace}" style="display:none"><span class="sm-sub-tip">子推荐意图</span><select id="sel_sub_${b.id}_${t.trace}" class="sm-subsel">${recSubOpts}</select></span>`
        : '';
      const selAttrs = isIntent ? ` onchange="onRecMainChange('${b.id}','${t.trace}')"` : '';
      badge = `<span class="sm-st pending">待标注</span>`;
      action = `<select id="sel_${b.id}_${t.trace}" class="sm-sel"${selAttrs}>${opts}</select>${subWrap}<button class="btn sm primary" onclick="annotatePath('${b.id}','${t.trace}')">确认标注</button>`;
    } else {
      /* 确认标注后不可再更改，直接收拢进 Golden不提供撤标/归档 */
      const subTxt = (b.model==='intent' && t.correct==='dispatch_recommend_agent' && t.correct_sub) ? ('   '+pathLabel('recommend', t.correct_sub)) : '';
      badge = `<span class="sm-st done">已标注   ${pathLabel(b.model,t.model_router)} → ${pathLabel(b.model,t.correct)}${subTxt}</span>`;
      action = '';
    }
    return `<div class="bk-trace sm ${stCls}">
      <span class="bk-tid">${t.trace}</span>
      <span class="bk-utt">${t.utter}<div class="bk-resp">${t.resp}</div></span>
      <span class="bk-meta">${(b.model!=='intent')?`<span class="score ${t.score<=2.5?'s-low':t.score<3.5?'s-mid':'s-high'}">${t.score}</span>`:''}${mis?'<span class="sm-mis-tag">模型结果与人工标注一致</span>':''}</span>
      <div class="sm-row"><button class="btn sm ghost" onclick="openDrawer('${t.trace}')">查看完整会话</button>${badge}${action}</div>
    </div>`;
  });
}

function setObj(id){ return GOLDEN_SETS.find(s=>s.id===id); }
function setLocked(setId){ const s=setObj(setId); return !!(s&&s.locked); }

function smLineChart(vals, o){
  const W=620,H=160,padL=46,padR=14,padT=18,padB=22;
  const n=vals.length;
  // counts 类型：把 max 圆整到 500<5K/1000≥5K整数倍，让 5 档刻度更整洁
  let max=o.max;
  if(!o.pct){
    const dataMax=Math.max(...vals);
    if(dataMax>0){
      max = dataMax<=5 ? 5 : (dataMax<5000 ? Math.ceil(dataMax/500)*500 : Math.ceil(dataMax/1000)*1000);
    }
  }
  const x=i=> padL + (W-padL-padR)*(n<=1?0.5:i/(n-1));
  const y=v=> padT + (H-padT-padB)*(1 - v/max);
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${x(n-1).toFixed(1)} ${(H-padB).toFixed(1)} L ${x(0).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  // 圆点上方当日数值参考 dashboard hitTrendSvg
  const fmtDot=v=> o.pct ? (v*100).toFixed(1) : Math.round(v).toLocaleString();
  const dense=n>14;
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${o.color}"/>${(dense?'':`<text x="${p[0].toFixed(1)}" y="${(p[1]-6).toFixed(1)}" font-size="8" fill="var(--c-text-3)" text-anchor="middle">${fmtDot(vals[i])}</text>`)}`).join('');
  // Y 轴：5 档刻度 + 网格 + 标签
  const yFracs=[0,0.25,0.5,0.75,1];
  const fmtY=f=>{
    if(o.pct) return f.toString();
    const v=f*max;
    if(v===0) return '0';
    if(v<1000) return Math.round(v).toString();
    const k=v/1000;
    return (k===Math.floor(k)?k.toFixed(0):k.toFixed(1))+'K';
  };
  const yGrid=yFracs.map(f=>`<line x1="${padL}" y1="${y(f*max).toFixed(1)}" x2="${W-padR}" y2="${y(f*max).toFixed(1)}" stroke="var(--c-border)" stroke-width="0.5" opacity="0.4"/>`).join('');
  const yLab=yFracs.map(f=>`<text x="${padL-5}" y="${(y(f*max)+3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--c-text-3)">${fmtY(f)}</text>`).join('');
  // X 轴：日期标签M/D，30 天稀疏显示每 5 天 + 末点
  const xLab=(o.dates||[]).map((dt,i)=> (dense && !(i%5===0 || i===n-1)) ? '' : `<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8" fill="var(--c-text-3)">${dt}</text>`).join('');
  const base=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--c-border)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${yGrid}${yLab}${base}<path d="${area}" fill="${o.color}" opacity="0.10"/><path d="${d}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xLab}</svg>`;
}

function doSuspend(bid, tid){
  const ta=document.getElementById('susp-reason');
  const reason=(ta?ta.value:'').trim();
  if(!reason){ const e=document.getElementById('susp-err'); if(e)e.style.display='block'; if(ta){ta.focus();} return; }
  const b=DATA.badBuckets.find(x=>x.id===bid); if(!b) return;
  const t=b.traces.find(x=>x.trace===tid); if(!t) return;
  /* 悬挂：从原桶物理撤出，仅留在悬挂中视图 */
  const ix=b.traces.findIndex(x=>x.trace===tid);
  if(ix<0) return;
  const row=b.traces.splice(ix,1)[0];
  row.state='suspended'; row._reason=reason; row._suspendedAt=nowStr(); row._originBucket=b.id;
  row._suspendedBy=CUR_USER; row._firstScore=row.score; row._passStreak=0; row._rerunScores=[]; row._failCount=0;
  if(!DATA.suspended.find(x=>x.trace===tid)) DATA.suspended.push(row);
  closeModal();
  renderBadBuckets();
  toast('已从原桶撤出并悬挂 '+tid+'，等待每晚重跑');
}
function deleteSuspendedTrace(tid){

  if(b){ const i=b.traces.findIndex(x=>x.trace===tid); if(i>=0) b.traces.splice(i,1); }
  removeFromSuspended(tid);
  renderBadBuckets();

}

  const t=findSuspended(tid); if(!t) return;

function turnIsGolden(tid){
  if(!tid) return false;
  return GOLDEN.some(g=>g.id===tid);
}
function turnRegTag(n, tid){
  if(!turnIsRegistered(n, tid)) return '';
  const refs=traceIssueRefs(tid);
  if(refs.length) return traceStatusTag(tid);
  return '<span class="tag ok">已登记</span>';
}
function turnMarks(n, tid){
  return (n.problem?'<span class="tag problem">问题轮次</span>':'')
    +(turnIsGolden(tid)?'<span class="tag primary">Golden</span>':'')
    +turnRegTag(n, tid);
}

  closeDrawer();

}

/* info 气泡浮层：事件委托覆盖静态页与弹窗内动态渲染的 .info */
function initInfoTips(){
  let tip=document.getElementById('infoTip');
  if(!tip){ tip=document.createElement('div'); tip.id='infoTip'; tip.className='info-tip-float'; document.body.appendChild(tip); }
  if(tip._bound) return; tip._bound=true;
  /* 向上遍历节点树找 .info：兼容文本节点 target（真实浏览器悬停文字时 e.target 为文本节点，无 closest 方法） */
  function findInfo(node){
    let n=node;
    while(n && n!==document && n.nodeType!==9){
      if(n.classList && n.classList.contains && n.classList.contains('info')) return n;
      n = n.parentElement || n.parentNode || null;
    }
    return null;
  }
  document.addEventListener('mouseover', function(e){
    try{
      const el = findInfo(e.target);
      if(el && el.getAttribute('data-tip')){ showInfoTip(el, tip); }
    }catch(_){}
  });
  document.addEventListener('mouseout', function(e){
    try{
      const el = findInfo(e.target);
      if(!el) return;
      const rel = e.relatedTarget;
      const relInfo = rel ? findInfo(rel) : null;
      if(relInfo !== el){ tip.style.display='none'; }   /* 真正离开 .info 才隐藏，避免内部移动误关 */
    }catch(_){}
  });
  document.addEventListener('scroll', function(){ tip.style.display='none'; }, true);
}
function showInfoTip(el, tip){
  tip.textContent = el.getAttribute('data-tip');
  tip.style.display='block';
  const r = el.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let top = r.bottom + 8, left = r.left + (r.width - tw)/2;
  if(top + th > window.innerHeight - 8) top = r.top - th - 8;
  if(top < 8) top = 8;
  if(left < 8) left = 8;
  if(left + tw > window.innerWidth - 8) left = window.innerWidth - 8 - tw;
  tip.style.top = top + 'px'; tip.style.left = left + 'px';
}
